<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f7fb">
  <title>Zann-AI — Chatbot</title>

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ai-pribadi-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="font-['Inter']">

  <div class="app-shell">

    <!-- Header -->
    <header class="app-header">
      <div class="header-overlay" id="headerOverlay"></div>
      <div class="app-header-inner">
        <button id="menuToggle" class="menu-btn" aria-label="Buka menu" aria-expanded="false">
          <span class="menu-line"></span>
          <span class="menu-line"></span>
          <span class="menu-line"></span>
        </button>
        <div class="header-drawer" id="headerDrawer">
          <div class="brand">
            <div class="brand-logo">
              <img src="/assets/zann-Logo.png" alt="Zann-AI Logo" class="w-full h-full object-cover">
            </div>
            <div class="brand-text">
              <h1 class="brand-title">Zann-AI</h1>
              <p class="brand-subtitle">Custom Chatbot — Gemini &amp; Image Generation</p>
            </div>
          </div>

          <div class="header-actions">
            <button id="clearSessionBtn" class="btn-danger hidden" title="Hapus riwayat percakapan">
              <svg class="btn-icon-only" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              <span class="btn-label">Hapus Riwayat</span>
            </button>

            <button id="themeToggle" class="btn-icon" title="Ganti tema" aria-label="Ganti tema terang/gelap" aria-pressed="false">
              <svg id="themeIconSun" class="theme-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
              </svg>
              <svg id="themeIconMoon" class="theme-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
              </svg>
            </button>

            <button id="historyToggle" class="btn-icon" title="Riwayat chat" aria-label="Riwayat chat" aria-pressed="false" type="button">
              <svg class="history-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- History Overlay & Panel -->
    <div class="history-overlay" id="historyOverlay"></div>
    <div class="history-panel" id="historyPanel">
      <div class="history-header">
        <h2>Riwayat Chat</h2>
        <button id="historyClose" class="history-close" aria-label="Tutup riwayat" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="history-list is-hidden" id="historyList"></div>
      <div class="history-empty" id="historyEmpty">
        <p>Belum ada riwayat chat</p>
      </div>
    </div>

    <!-- Main Content -->
    <main class="app-main">

      <!-- Messages Area -->
      <div id="messagesArea" class="messages-area">

        <!-- Welcome Message -->
        <div id="welcomeMessage" class="message-row">
          <div class="avatar-ai">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
            </svg>
          </div>
          <div class="bubble-ai">
            <p>Halo! Saya <strong>Zann-AI</strong>. Tanyakan apa saja, saya siap membantu Anda.</p>
          </div>
        </div>

      </div>

      <!-- Typing Indicator -->
      <div class="typing-row">
        <div id="typingIndicator" class="hidden message-row">
          <div class="avatar-ai">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" />
            </svg>
          </div>
          <div class="bubble-ai">
            <div class="flex gap-1.5">
              <span class="typing-dot"></span>
              <span class="typing-dot" style="animation-delay: 0.15s"></span>
              <span class="typing-dot" style="animation-delay: 0.3s"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Input Dock -->
      <div class="input-dock">
        <div class="input-dock-inner">

          <div id="errorToast" class="error-toast hidden">
            <span id="errorText"></span>
          </div>

          <form id="chatForm" class="input-form" autocomplete="off">
            <textarea
              id="messageInput"
              rows="1"
              placeholder="Ketik pesan Anda..."
              class="input-field"
              maxlength="2000"
              required
            ></textarea>
            <button type="submit" id="sendBtn" class="btn-send" disabled aria-label="Kirim pesan">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
              </svg>
            </button>
          </form>

          <div class="input-meta">
            <p class="input-hint">Tekan Enter untuk kirim, Shift+Enter untuk baris baru</p>
            <div class="mode-switch">
              <button id="modeChat" class="mode-btn active">Chat</button>
              <button id="modeImage" class="mode-btn">Generate Image</button>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script src="js/ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/history.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
